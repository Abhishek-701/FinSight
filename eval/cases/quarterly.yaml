# Quarterly cases. Gold figures are from the seed companies' latest 10-Q XBRL.
# A FY 10-K figure served as "last quarter" must not pass.

- id: aapl-revenue-last-quarter
  question: "What was Apple's revenue last quarter?"
  tags: [quarterly, lookup]
  gold:
    retrieve:
      must_include: [AAPL-10Q-XBRL-RevenueFromContractWithCustomerExcludingAssessedTax]
      must_not_include: [AAPL-XBRL-RevenueFromContractWithCustomerExcludingAssessedTax]
      form: 10-Q
      ticker: AAPL
      k: 8
    answer:
      refuse: false
      numbers:
        - value: 109417
          unit: millions
          tolerance: 0
          period: "2026-06-27"
      must_cite: [AAPL-10Q-XBRL-RevenueFromContractWithCustomerExcludingAssessedTax]
      must_cite_form: 10-Q
      must_not_match: ["416,?161"]
    faithfulness: numbers_in_evidence
  judge:
    rubrics: [faithfulness, correctness, period_labeled]
    notes: "Last quarter is the quarter ended June 27, 2026, $109,417 million, not FY2025 $416,161 million."

- id: nvda-revenue-last-quarter
  question: "What was NVIDIA's revenue last quarter?"
  tags: [quarterly, lookup]
  gold:
    retrieve:
      must_include: [NVDA-10Q-XBRL-Revenues]
      must_not_include: [NVDA-XBRL-Revenues]
      form: 10-Q
      ticker: NVDA
    answer:
      refuse: false
      numbers:
        - value: 81615
          unit: millions
          tolerance: 0
          period: "2026-04-26"
      must_cite: [NVDA-10Q-XBRL-Revenues]
      must_cite_form: 10-Q
      must_not_match: ["215,?938"]
    faithfulness: numbers_in_evidence
  judge:
    rubrics: [period_labeled, correctness]
    notes: "Last quarter is the quarter ended April 26, 2026, $81,615 million, not full-year $215,938 million."

- id: aapl-risks-still-10k
  question: "What are Apple's key risks?"
  tags: [quarterly, filing]
  gold:
    retrieve:
      must_include: [AAPL-0012]
      ticker: AAPL
      form: 10-K
    answer:
      refuse: false
      must_cite_form: 10-K
  judge:
    rubrics: [faithfulness]
    notes: "Key risks come from 10-K Item 1A, not the 10-Q risk-factor update unless asked."
