# Filing lookups, YoY, segments, comparisons, multi-statement, semantic.
# Gold numbers are from the seed 10-K XBRL / Item 8 (see eval/results.md answers).

- id: aapl-opinc-fy2025
  question: "What was Apple's total operating income for fiscal year 2025?"
  tags: [filing, lookup, smoke]
  gold:
    retrieve:
      must_include: [AAPL-XBRL-OperatingIncomeLoss]
      form: 10-K
      ticker: AAPL
      k: 8
    answer:
      refuse: false
      numbers:
        - value: 133050
          unit: millions
          period: FY2025
      must_cite: [AAPL-XBRL-OperatingIncomeLoss]
      must_not_match: ["net income of"]
    faithfulness: numbers_in_evidence
  judge:
    rubrics: [faithfulness, correctness]
    notes: "Must report operating income $133,050 million, not net income. Period is FY ended Sep 27, 2025."

