# V7: user data (users, sessions, portfolio, watchlist, chat, audit, metrics) lives in
# Supabase Postgres via DATABASE_URL. Set the secret in the Render dashboard to your
# Supabase connection string (pooled URI preferred). Filing corpus / Chroma stay in the image.

services:
  - type: web
    name: finsight
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINSIGHT_USE_RERANKER
        value: "0"
      - key: FINSIGHT_RATE_LIMIT_PER_MINUTE
        value: "30"
      # Supabase Postgres URI — durable across Render redeploys (replaces free-tier Render Postgres).
      - key: DATABASE_URL
        sync: false
      # Google OAuth — login is optional/additive; unset, the app runs anonymous-only.
      # FINSIGHT_BASE_URL must match this service's real URL (known only after first deploy)
      # and must be registered as an authorized redirect URI (BASE_URL + /api/auth/google/callback)
      # in the Google Cloud OAuth client console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FINSIGHT_BASE_URL
        sync: false
      - key: FINSIGHT_COOKIE_SECURE
        value: "1"
      - key: FINSIGHT_ADMIN_EMAILS
        sync: false
